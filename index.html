  <body>
    <div id="root"></div>
      <div id="app-splash" role="status" aria-label="Carregando DH Financeira" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#042A40;color:#fff;font-family:Poppins,system-ui,sans-serif;transition:opacity .35s ease;">
      <div aria-hidden="true" style="position:relative;width:112px;height:112px;overflow:hidden;margin-bottom:20px"><img src="/brand/dh-financeira-symbol.png" alt="" fetchpriority="high" width="512" height="512" style="width:100%;height:100%;object-fit:contain;border-radius:24px" /></div>
      <strong style="color:#00B6EF;letter-spacing:.12em;font-size:13px">DH FINANCEIRA</strong>
      <p style="font-size:14px;margin:16px 20px;text-align:center">Preparando seu acesso.</p>
      <div aria-hidden="true" style="height:3px;width:150px;background:#00B6EF33;overflow:hidden;border-radius:4px"><div style="height:100%;width:45%;background:#00B6EF;animation:sj-progress 1.7s ease-in-out infinite"></div></div>
      <style>@keyframes sj-progress{from{transform:translateX(-100%)}to{transform:translateX(325%)}}@media(prefers-reduced-motion:reduce){#app-splash,#app-splash *{animation:none!important;transition:none!important}}</style>
    </div>
    <script>
      (function () {
        var splashRemoved = false;
        window.__SJ_HIDE_SPLASH__ = function () {
          if (splashRemoved) return;
          splashRemoved = true;
          try { sessionStorage.removeItem("__sj_boot_recovering"); } catch (e) {}
          var splash = document.getElementById("app-splash");
          if (!splash) return;
          splash.style.opacity = "0";
          setTimeout(function () { splash.remove(); }, 350);
        };

        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) window.__SJ_HIDE_SPLASH__();
          }, 1200);
        });

        setTimeout(function () {
          var root = document.getElementById("root");
          var splash = document.getElementById("app-splash");
          if (!splash || (root && root.childElementCount > 0)) return;
          var alreadyRecovering = false;
          try { alreadyRecovering = sessionStorage.getItem("__sj_boot_recovering") === "1"; } catch (e) {}
          if (!alreadyRecovering) {
            try { sessionStorage.setItem("__sj_boot_recovering", "1"); } catch (e) {}
            Promise.all([
              window.caches && caches.keys ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); }) : Promise.resolve(),
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); }) : Promise.resolve()
            ]).finally(function () { location.reload(); });
            return;
          }
          splash.innerHTML = '<div style="font-size:1rem;font-weight:700;margin-bottom:.5rem;">Não foi possível carregar</div><div style="font-size:.85rem;color:#aab6d3;margin-bottom:1rem;text-align:center;max-width:300px;">Atualize a página para limpar o cache e tentar novamente.</div><button type="button" style="border:0;border-radius:10px;background:#3b6fc4;color:white;font-weight:700;padding:.75rem 1rem;cursor:pointer;">Atualizar</button>';
          splash.querySelector("button").onclick = function () {
            Promise.all([
              window.caches && caches.keys ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); }) : Promise.resolve(),
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); }) : Promise.resolve()
            ]).finally(function () { location.reload(); });
          };
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
